<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <title>slither</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#131a26">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preload" href="fonts/Archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
 </head>
 <body>

  <div id="login">
   <div class="login-stack">
    <div id="logo"></div>
    <div id="lastscore"></div>
    <div id="nick_holder">
     <label for="nick" class="sr-only">Nickname</label>
     <input id="nick" placeholder="Nickname" maxlength="24" spellcheck="false" autocomplete="off">
    </div>
    <div id="playh"></div>
    <div id="tips" class="nsi" aria-live="polite"></div>
   </div>
  </div>

  <div id="smh">
   <div id="cskh">
    <button type="button" class="ui-text-btn" id="csk">
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3Z"/><circle cx="7.5" cy="11.5" r="1.3"/><circle cx="10.5" cy="7.5" r="1.3"/><circle cx="15" cy="7.8" r="1.3"/></svg>
     <span>Change skin</span>
    </button>
   </div>

   <div id="bskh">
    <button type="button" class="ui-text-btn" id="bsk">
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
     <span>Build skin</span>
    </button>
   </div>

   <div id="grqh">
    <button type="button" class="ui-text-btn" id="grq" aria-pressed="true">
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>
     <span id="grqi">High quality</span>
    </button>
   </div>
  </div>

  <div id="pskh">
   <button type="button" class="ui-round" id="psk" aria-label="Previous skin">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
   </button>
  </div>

  <div id="nskh">
   <button type="button" class="ui-round" id="nsk" aria-label="Next skin">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
   </button>
  </div>

  <script src="js/game.js"></script>
 </body>
</html>
